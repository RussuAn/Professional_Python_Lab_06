[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-testing-lab06"
version = "0.1.0"
description = "Lab 06 variant 1: unit, integration and coverage testing of a student accounting application"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Руссу Анастасія"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.23"]

[project.scripts]
student-testing = "student_testing.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["unit: fast isolated unit tests", "integration: end-to-end integration scenarios"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["student_testing"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
